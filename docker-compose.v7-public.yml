# (7.0.0) 학교 서버 외부 공개 덮어쓰기 — v7 앱을 호스트 5001(모든 인터페이스)로 옮긴다.
# - 단독으로 쓰지 않는다. 반드시 docker-compose.v7-demo.yml 뒤에 붙이고 프로젝트 fastapi-v7-demo 로 실행한다:
#     C="docker compose -p fastapi-v7-demo -f docker-compose.v7-demo.yml -f docker-compose.v7-public.yml"
# - 바꾸는 것은 app 의 호스트 포트 하나뿐이다(127.0.0.1:8007 → 5001). 이미지·환경변수·네트워크·볼륨·db 는 원본 그대로다.
#   db 서비스는 여기서 건드리지 않으므로 `up -d --no-deps app` 때 다시 만들어지지 않는다.
# - 5001 은 v6 FastApi-app 이 쓰던 포트다. v6 을 먼저 `docker stop` 해야 한다(삭제하지 않는다).
# - 주의: HTTP 공개다. 데이터 API 15개는 인증 없이 열려 있고(V7_PLAN.md R-34), 가입·로그인 비밀번호와
#   세션 쿠키는 암호화 없이 전송된다(COOKIE_SECURE=false, HTTPS 없음).
# - 주의: v6 Jenkins/수동 배포(`docker compose up -d --no-deps fastapi-app`)가 돌면 5001 포트 충돌이 난다.
services:
  app:
    ports: !override
      - "5001:8000"
