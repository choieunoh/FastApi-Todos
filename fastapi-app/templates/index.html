<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
        form { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 1rem; }
        input[type="text"] { flex: 1 1 12rem; padding: .5rem; }
        ul { list-style: none; padding: 0; }
        li { display: flex; align-items: center; gap: .5rem; padding: .4rem 0; border-bottom: 1px solid #e5e5e5; }
        li span { flex: 1; }
        .done { text-decoration: line-through; color: #888; }
        .version {
         color: #666;
         font-size: 0.9rem;
         margin-top: -1rem;
         margin-bottom: 1.5rem;
        }
        #error { color: #b00020; }
        .controls {
           margin-bottom: 1rem;
         }

        #search {
         width: 100%;
         padding: .5rem;
         box-sizing: border-box;
        }
        .filter-buttons {
         display: flex;
         gap: .5rem;
         margin-top: .5rem;
        }

        .filter-buttons button {
         padding: .4rem .8rem;
         cursor: pointer;
        }
        .sort-controls {
         display: flex;
         align-items: center;
         gap: .5rem;
         margin-top: .8rem;
        }

        .sort-controls select {
         padding: .4rem;
        }

        .overdue {
         color: #b00020;
         font-weight: bold;
        }
     </style>
</head>
<body>
    <h1>To-Do List</h1>
    <p class="version">Version 3.0.0</p>
    <form id="todo-form">
      <input
        type="text"
        id="title"
        placeholder="제목 (예: 오픈소스 과제)"
        required
      >

      <input
        type="text"
        id="description"
        placeholder="설명 (예: 보고서 작성)"
      >

      <select id="priority">
        <option value="높음">높음</option>
        <option value="보통" selected>보통</option>
        <option value="낮음">낮음</option>
      </select>

      <input
        type="date"
        id="due-date"
      >

      <button type="submit">Add To-Do</button>
    </form>
    <div class="controls">
      <input
        type="text"
        id="search"
        placeholder="할 일 검색"
      >
      <div class="filter-buttons">
        <button type="button" data-filter="all">전체</button>
        <button type="button" data-filter="active">진행 중</button>
        <button type="button" data-filter="completed">완료</button>
      </div>
      <div class="sort-controls">
       <label for="sort">정렬:</label>
       <select id="sort">
         <option value="default">기본순</option>
         <option value="priority">우선순위순</option>
         <option value="due-date">마감일순</option>
       </select>
      </div>
    </div>
    <p id="error" role="alert" hidden></p>
    <ul id="todo-list"></ul>
    <script>
        const $ = (id) => document.getElementById(id);
        const listEl = $("todo-list"), errorEl = $("error");
        let allTodos = [];

        const searchEl = $("search");
        const sortEl = $("sort");

        let currentFilter = "all";

        const filterButtons = document.querySelectorAll("[data-filter]");

        // 모든 요청을 한 곳에서 처리하고, 실패는 조용히 넘기지 않는다
        async function api(url, method = "GET", body) {
          const res = await fetch(url, body
            ? { method, headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }
            : { method });
          if (!res.ok) throw new Error(`${res.status} ${await res.text()}`);
          return res.status === 204 ? null : res.json();
        }

        // 작업을 실행하고, 실패하면 화면에 이유를 띄운다
        async function run(what, job) {
          try {
            await job();
            errorEl.hidden = true;
          } catch (e) {
            errorEl.textContent = `${what} 실패: ${e.message}`;
            errorEl.hidden = false;
          }
        }

        const load = () => run("목록 불러오기", async () => {
        allTodos = await api("/todos");
        applyFilters();
        });

        function applyFilters() {
        const keyword = searchEl.value.trim().toLowerCase();

        const filtered = allTodos.filter((todo) => {
        const matchesSearch =
        todo.title.toLowerCase().includes(keyword) ||
        todo.description.toLowerCase().includes(keyword);

        const matchesFilter =
        currentFilter === "all" ||
        (currentFilter === "active" && !todo.completed) ||
        (currentFilter === "completed" && todo.completed);

        return matchesSearch && matchesFilter;
        });
        // 정렬
        if (sortEl.value === "priority") {
          const priorityOrder = {
            "높음": 1,
            "보통": 2,
            "낮음": 3
          };

          filtered.sort((a, b) => {
            return (priorityOrder[a.priority] || 2) -
                   (priorityOrder[b.priority] || 2);
          });
        }

        if (sortEl.value === "due-date") {
          filtered.sort((a, b) => {
            if (!a.due_date && !b.due_date) return 0;
            if (!a.due_date) return 1;
            if (!b.due_date) return -1;

            return a.due_date.localeCompare(b.due_date);
          });
        }

        render(filtered);
        }

        searchEl.addEventListener("input", applyFilters);
        sortEl.addEventListener("change", applyFilters);
        filterButtons.forEach((button) => {
        button.addEventListener("click", () => {
        currentFilter = button.dataset.filter;
        applyFilters();
        });
        });
        const save = (id, todo) => run("수정", async () => { await api(`/todos/${id}`, "PUT", todo); await load(); });

        function button(label, onclick) {
          return Object.assign(document.createElement("button"), { textContent: label, onclick });
        }

        function render(todos) {
          listEl.replaceChildren(...todos.map((todo) => {
            const check = Object.assign(document.createElement("input"), {
              type: "checkbox",
              checked: todo.completed,
              onchange: () => save(todo.id, { ...todo, completed: check.checked }),
            });
            const now = new Date();
            const today =
              `${now.getFullYear()}-` +
              `${String(now.getMonth() + 1).padStart(2, "0")}-` +
              `${String(now.getDate()).padStart(2, "0")}`;

            const isOverdue =
              todo.due_date &&
              todo.due_date < today &&
              !todo.completed;

            const text = Object.assign(document.createElement("span"), {
              textContent:
                `${todo.title} — ${todo.description} | ` +
                `우선순위: ${todo.priority || "보통"} | ` +
                `마감일: ${todo.due_date || "없음"}` +
                (isOverdue ? " | ⚠ 기한 초과" : ""),

              className: todo.completed
                ? "done"
                : isOverdue
                  ? "overdue"
                  : "",
            });
            const li = document.createElement("li");
            li.append(check, text, button("Edit", () => edit(todo)), button("Delete", () => remove(todo.id)));
            return li;
          }));
        }

        function edit(todo) {
          const title = prompt("새 제목:", todo.title);
          if (title === null) return;

          const description = prompt("새 설명:", todo.description);
          if (description === null) return;

          const priority = prompt(
            "새 우선순위 (높음 / 보통 / 낮음):",
            todo.priority || "보통"
          );
          if (priority === null) return;

          if (!["높음", "보통", "낮음"].includes(priority.trim())) {
            alert("우선순위는 높음, 보통, 낮음 중 하나를 입력해주세요.");
            return;
          }

          const dueDate = prompt(
            "새 마감일 (YYYY-MM-DD, 없으면 빈칸):",
            todo.due_date || ""
          );
          if (dueDate === null) return;

          save(todo.id, {
            ...todo,
            title: title.trim(),
            description: description.trim(),
            priority: priority.trim(),
            due_date: dueDate.trim()
          });
        }

        function remove(id) {
          if (!confirm("정말 삭제할까요?")) return;
          run("삭제", async () => { await api(`/todos/${id}`, "DELETE"); await load(); });
        }

        $("todo-form").onsubmit = (event) => {
          event.preventDefault();

          run("추가", async () => {
            await api("/todos", "POST", {
              title: $("title").value.trim(),
              description: $("description").value.trim(),
              priority: $("priority").value,
              due_date: $("due-date").value
            });

            event.target.reset();
            await load();
          });
        };

        load();
     </script>
</body>
</html>
