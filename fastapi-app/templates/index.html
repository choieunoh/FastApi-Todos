<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-Do List</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 640px; margin: 2rem auto; padding: 0 1rem; }
        form { display: flex; gap: .5rem; flex-wrap: wrap; margin-bottom: 1rem; }
        input[type="text"] { flex: 1 1 12rem; padding: .5rem; }
        ul { list-style: none; padding: 0; }
        li { display: flex; align-items: center; gap: .5rem; padding: .4rem 0; border-bottom: 1px solid #e5e5e5; }
        .content { flex: 1; display: flex; flex-direction: column; gap: .25rem; min-width: 0; }
        .done { text-decoration: line-through; color: #888; }
        .version {
          color: #666;
          font-size: 0.9rem;
          margin-top: -1rem;
          margin-bottom: 1.5rem;
        }
        #error { color: #b00020; }
        .controls {
          margin-bottom: 1rem;
        }

        #search {
          width: 100%;
          padding: .5rem;
          box-sizing: border-box;
        }
        .filter-buttons {
          display: flex;
          gap: .5rem;
          margin-top: .5rem;
        }

        .filter-buttons button {
          padding: .4rem .8rem;
          cursor: pointer;
        }
        .filter-buttons button.active {
          background: #333;
          color: #fff;
          border-color: #333;
        }
        .sort-controls {
          display: flex;
          align-items: center;
          flex-wrap: wrap;
          gap: .5rem;
          margin-top: .8rem;
        }

        .sort-controls select {
          padding: .4rem;
        }

        .overdue {
          color: #b00020;
          font-weight: bold;
        }

        .stats {
          display: flex;
          flex-wrap: wrap;
          gap: .4rem 1rem;
          padding: .6rem .8rem;
          margin-bottom: 1rem;
          background: #f5f5f5;
          border-radius: 6px;
        }

        .tags { display: flex; flex-wrap: wrap; gap: .3rem; }
        .tags:empty { display: none; }
        .tag {
          padding: .1rem .5rem;
          font-size: .8rem;
          border: 1px solid #c8d6f0;
          border-radius: 999px;
          background: #eef3fc;
          color: #2a4a8a;
          cursor: pointer;
        }

        .meta { display: flex; flex-wrap: wrap; gap: .6rem; font-size: .8rem; color: #777; }
        .meta:empty { display: none; }
        .dday { font-weight: bold; color: #2a4a8a; }
        .recurrence { font-weight: bold; color: #6a4c93; }
        .dday.overdue { color: #b00020; }

        .edit-form { flex: 1; margin: 0; }

        .bulk-bar {
          display: flex;
          flex-wrap: wrap;
          align-items: center;
          gap: .5rem;
          padding: .4rem .6rem;
          margin-bottom: .5rem;
          border: 1px solid #e5e5e5;
          border-radius: 6px;
        }
        .bulk-bar #bulk-count { margin-right: auto; font-size: .9rem; color: #555; }
        li.selected { background: #f3f7ff; }

        .undo-toast {
          position: fixed;
          left: 50%;
          bottom: 1.5rem;
          transform: translateX(-50%);
          display: flex;
          align-items: center;
          gap: .8rem;
          padding: .6rem 1rem;
          color: #fff;
          background: #333;
          border-radius: 6px;
          box-shadow: 0 2px 8px rgba(0, 0, 0, .25);
        }
        .undo-toast[hidden] { display: none; }
        .undo-toast button {
          color: #ffd54f;
          font-weight: bold;
          background: none;
          border: none;
          cursor: pointer;
        }

        .subtask-head { display: flex; align-items: center; gap: .6rem; font-size: .85rem; }
        .subtask-toggle { padding: 0; color: #2a4a8a; background: none; border: none; cursor: pointer; }
        .subtask-progress { display: inline-flex; align-items: center; gap: .3rem; color: #555; }
        .subtask-progress progress { width: 5rem; height: .6rem; }
        .subtasks { margin-top: .2rem; padding-left: .6rem; border-left: 2px solid #e5e5e5; }
        .subtasks ul { margin: 0; }
        .subtasks li { padding: .15rem 0; border-bottom: none; font-size: .9rem; }
        .subtasks li span { flex: 1; min-width: 0; }
        .subtasks form { margin: .2rem 0 0; }
        .subtasks input[type="text"] { flex: 1 1 8rem; padding: .25rem; }

        .favorite {
          padding: 0 .2rem;
          font-size: 1.2rem;
          line-height: 1;
          color: #c9a400;
          background: none;
          border: none;
          cursor: pointer;
        }
     </style>
</head>
<body>
    <h1>To-Do List</h1>
    <p class="version">Version 5.0.0</p>
    <form id="todo-form">
      <input
        type="text"
        id="title"
        placeholder="제목 (예: 오픈소스 과제)"
        required
      >

      <input
        type="text"
        id="description"
        placeholder="설명 (예: 보고서 작성)"
      >

      <select id="priority" aria-label="우선순위"></select>

      <input
        type="date"
        id="due-date"
        aria-label="마감일"
      >

      <select id="recurrence" aria-label="반복"></select>

      <input
        type="text"
        id="tags"
        placeholder="태그 (쉼표로 구분, 예: 학교, 과제)"
      >

      <button type="submit">Add To-Do</button>
    </form>
    <div class="stats" aria-label="진행률 통계">
      <span>전체 <strong id="stat-total" data-testid="stat-total">0</strong></span>
      <span>완료 <strong id="stat-completed" data-testid="stat-completed">0</strong></span>
      <span>진행 중 <strong id="stat-active" data-testid="stat-active">0</strong></span>
      <span>기한 초과 <strong id="stat-overdue" data-testid="stat-overdue">0</strong></span>
      <span>완료율 <strong id="stat-rate" data-testid="stat-rate">0%</strong></span>
    </div>
    <div class="controls">
      <input
        type="text"
        id="search"
        placeholder="할 일 검색"
      >
      <div class="filter-buttons">
        <button type="button" data-filter="all">전체</button>
        <button type="button" data-filter="active">진행 중</button>
        <button type="button" data-filter="completed">완료</button>
        <button type="button" id="favorite-filter" data-testid="favorite-filter" aria-pressed="false">★ 즐겨찾기만</button>
      </div>
      <div class="sort-controls">
        <label for="sort">정렬:</label>
        <select id="sort">
          <option value="default">기본순</option>
          <option value="priority">우선순위순</option>
          <option value="due-date">마감일순</option>
        </select>
        <label for="tag-filter">태그:</label>
        <select id="tag-filter" data-testid="tag-filter">
          <option value="">전체 태그</option>
        </select>
      </div>
    </div>
    <div class="bulk-bar" data-testid="bulk-bar" aria-label="일괄 작업">
      <span id="bulk-count" aria-live="polite">0개 선택</span>
      <button type="button" id="bulk-select-all" data-testid="bulk-select-all">보이는 항목 전체 선택</button>
      <button type="button" id="bulk-complete" data-testid="bulk-complete" disabled>완료</button>
      <button type="button" id="bulk-uncomplete" data-testid="bulk-uncomplete" disabled>미완료</button>
      <button type="button" id="bulk-delete" data-testid="bulk-delete" disabled>삭제</button>
    </div>
    <p id="error" role="alert" hidden></p>
    <ul id="todo-list"></ul>
    <div id="undo-toast" class="undo-toast" data-testid="undo-toast" role="status" hidden>
      <span id="undo-message"></span>
      <button type="button" id="undo-button" data-testid="undo-button">실행 취소</button>
    </div>
    <script>
        const $ = (id) => document.getElementById(id);
        const listEl = $("todo-list"), errorEl = $("error");
        const searchEl = $("search"), sortEl = $("sort"), tagFilterEl = $("tag-filter");
        const filterButtons = document.querySelectorAll("[data-filter]");
        const favoriteFilterEl = $("favorite-filter");

        // 우선순위는 여기 한 곳에서만 정의한다
        const PRIORITIES = ["높음", "보통", "낮음"];
        const DEFAULT_PRIORITY = "보통";

        // 반복 주기와 표시 이름도 여기 한 곳에서만 정의한다 (서버 Recurrence 와 같은 값)
        const RECURRENCES = { none: "반복 없음", daily: "매일", weekly: "매주", monthly: "매월" };
        const DEFAULT_RECURRENCE = "none";
        const PRIORITY_ORDER = Object.fromEntries(PRIORITIES.map((p, i) => [p, i]));

        // PUT 은 전체 교체이므로 클라이언트가 정하는 필드는 여기 한 곳에서만 나열한다
        const TODO_FIELDS = ["title", "description", "completed", "priority", "due_date", "tags", "favorite", "recurrence"];

        let allTodos = [];
        let currentFilter = "all";
        let favoriteOnly = false;                // 즐겨찾기만 보기 (다른 필터와 AND)

        const UNDO_MS = 5000;                    // 실행 취소 토스트를 보여주는 시간 (서버 보관은 30초)
        let undoIds = [];                        // 마지막 삭제에서 지운 id들
        let undoTimer = null;

        const selectedIds = new Set();           // 일괄 작업 대상 (지금 보이는 항목만 남긴다)
        let visibleIds = [];

        const expandedSubtasks = new Set();      // 하위 목록을 펼친 할 일 (새로고침하면 다시 접힌다)
        let editingSubtask = null;               // 제목을 고치는 하위 할 일 { todoId, id } — 한 번에 하나
        let editingId = null;                    // 수정 폼이 열린 항목 (한 번에 하나)

        // 모든 요청을 한 곳에서 처리하고, 실패는 조용히 넘기지 않는다
        async function api(url, method = "GET", body) {
          const res = await fetch(url, body
            ? { method, headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }
            : { method });
          if (!res.ok) throw new Error(`${res.status} ${await res.text()}`);
          return res.status === 204 ? null : res.json();
        }

        // 작업을 실행하고, 실패하면 화면에 이유를 띄운다
        async function run(what, job) {
          try {
            await job();
            errorEl.hidden = true;
          } catch (e) {
            errorEl.textContent = `${what} 실패: ${e.message}`;
            errorEl.hidden = false;
          }
        }

        function el(tag, props = {}) {
          return Object.assign(document.createElement(tag), props);
        }

        function button(label, onclick) {
          return el("button", { type: "button", textContent: label, onclick });
        }

        // [값, 표시 이름] 목록으로 select 를 채운다 (form.reset() 이 기본값으로 돌아가도록 defaultSelected 도 둔다)
        function fillOptions(select, entries, selected) {
          select.replaceChildren(...entries.map(([value, label]) =>
            el("option", { value, textContent: label, defaultSelected: value === selected, selected: value === selected })));
        }

        const priorityOptions = (select, selected) => fillOptions(select, PRIORITIES.map((p) => [p, p]), selected);
        const recurrenceOptions = (select, selected) => fillOptions(select, Object.entries(RECURRENCES), selected);

        // 날짜는 모두 브라우저 로컬 기준 YYYY-MM-DD 로 다룬다
        function ymd(d) {
          return `${d.getFullYear()}-` +
            `${String(d.getMonth() + 1).padStart(2, "0")}-` +
            `${String(d.getDate()).padStart(2, "0")}`;
        }

        const todayStr = () => ymd(new Date());

        // 기존 값에 바꿀 값만 덮어써서 PUT 본문을 만든다 (빠진 필드가 기본값으로 지워지지 않게)
        function toPayload(todo, overrides = {}) {
          const merged = { ...todo, ...overrides };
          return Object.fromEntries(TODO_FIELDS.map((key) => [key, merged[key]]));
        }

        const parseTags = (text) => text.split(",").map((t) => t.trim()).filter(Boolean);

        const isOverdue = (todo, today) =>
          Boolean(todo.due_date) && todo.due_date < today && !todo.completed;

        function ddayLabel(dueDate, today) {
          const toUtc = (s) => { const [y, m, d] = s.split("-").map(Number); return Date.UTC(y, m - 1, d); };
          const days = Math.round((toUtc(dueDate) - toUtc(today)) / 86400000);
          if (days > 0) return `D-${days}`;
          if (days === 0) return "오늘 마감";
          return `D+${-days}`;
        }

        const load = () => run("목록 불러오기", async () => {
          allTodos = await api("/todos");
          renderTagOptions();
          applyFilters();
        });

        // 지금 존재하는 태그로 필터 목록을 다시 만든다 (선택한 태그가 사라지면 전체로)
        function renderTagOptions() {
          const selected = tagFilterEl.value;
          const tags = [...new Set(allTodos.flatMap((todo) => todo.tags))].sort((a, b) => a.localeCompare(b, "ko"));
          tagFilterEl.replaceChildren(
            el("option", { value: "", textContent: "전체 태그" }),
            ...tags.map((tag) => el("option", { value: tag, textContent: tag })),
          );
          tagFilterEl.value = tags.includes(selected) ? selected : "";
        }

        function applyFilters() {
          const keyword = searchEl.value.trim().toLowerCase();
          const tag = tagFilterEl.value;

          const filtered = allTodos.filter((todo) => {
            const matchesSearch =
              todo.title.toLowerCase().includes(keyword) ||
              todo.description.toLowerCase().includes(keyword);

            const matchesFilter =
              currentFilter === "all" ||
              (currentFilter === "active" && !todo.completed) ||
              (currentFilter === "completed" && todo.completed);

            const matchesTag = !tag || todo.tags.includes(tag);

            const matchesFavorite = !favoriteOnly || todo.favorite;

            return matchesSearch && matchesFilter && matchesTag && matchesFavorite;
          });

          // 정렬
          if (sortEl.value === "priority") {
            const order = (p) => PRIORITY_ORDER[p] ?? PRIORITY_ORDER[DEFAULT_PRIORITY];
            filtered.sort((a, b) => order(a.priority) - order(b.priority));
          }

          if (sortEl.value === "due-date") {
            filtered.sort((a, b) => {
              if (!a.due_date && !b.due_date) return 0;
              if (!a.due_date) return 1;
              if (!b.due_date) return -1;

              return a.due_date.localeCompare(b.due_date);
            });
          }

          filterButtons.forEach((btn) => {
            const active = btn.dataset.filter === currentFilter;
            btn.classList.toggle("active", active);
            btn.setAttribute("aria-pressed", active);
          });
          favoriteFilterEl.classList.toggle("active", favoriteOnly);
          favoriteFilterEl.setAttribute("aria-pressed", favoriteOnly);

          // 필터로 가려진 항목은 선택에서 뺀다
          visibleIds = filtered.map((todo) => todo.id);
          for (const id of [...selectedIds]) if (!visibleIds.includes(id)) selectedIds.delete(id);

          const today = todayStr();
          renderStats(today);
          render(filtered, today);
          renderBulkBar();
        }

        function renderBulkBar() {
          const count = selectedIds.size;
          const allSelected = visibleIds.length > 0 && visibleIds.every((id) => selectedIds.has(id));
          $("bulk-count").textContent = `${count}개 선택`;
          $("bulk-select-all").textContent = allSelected ? "선택 해제" : "보이는 항목 전체 선택";
          $("bulk-select-all").disabled = visibleIds.length === 0;
          for (const id of ["bulk-complete", "bulk-uncomplete", "bulk-delete"]) $(id).disabled = count === 0;
        }

        // 통계는 필터와 상관없이 전체 목록 기준
        function renderStats(today) {
          const total = allTodos.length;
          const completed = allTodos.filter((todo) => todo.completed).length;
          const overdue = allTodos.filter((todo) => isOverdue(todo, today)).length;
          $("stat-total").textContent = total;
          $("stat-completed").textContent = completed;
          $("stat-active").textContent = total - completed;
          $("stat-overdue").textContent = overdue;
          $("stat-rate").textContent = `${total ? Math.round(completed / total * 100) : 0}%`;
        }

        searchEl.addEventListener("input", applyFilters);
        sortEl.addEventListener("change", applyFilters);
        tagFilterEl.addEventListener("change", applyFilters);
        filterButtons.forEach((btn) => {
          btn.addEventListener("click", () => {
            currentFilter = btn.dataset.filter;
            applyFilters();
          });
        });
        favoriteFilterEl.addEventListener("click", () => {
          favoriteOnly = !favoriteOnly;
          applyFilters();
        });

        const save = (todo, overrides) => run("수정", async () => {
          await api(`/todos/${todo.id}`, "PUT", toPayload(todo, overrides));
          await load();
        });

        function render(todos, today) {
          listEl.replaceChildren(...todos.map((todo) =>
            todo.id === editingId ? renderEditItem(todo) : renderItem(todo, today)));
        }

        function renderItem(todo, today) {
          const li = el("li", { className: selectedIds.has(todo.id) ? "selected" : "" });

          const pick = el("input", {
            type: "checkbox",
            checked: selectedIds.has(todo.id),
            onchange: () => {
              if (pick.checked) selectedIds.add(todo.id); else selectedIds.delete(todo.id);
              li.classList.toggle("selected", pick.checked);
              renderBulkBar();
            },
          });
          pick.dataset.testid = "bulk-select";
          pick.setAttribute("aria-label", `${todo.title} 선택`);

          const check = el("input", {
            type: "checkbox",
            checked: todo.completed,
            onchange: () => save(todo, { completed: check.checked }),
          });
          check.className = "todo-check";
          check.setAttribute("aria-label", `${todo.title} 완료`);

          const star = button(todo.favorite ? "★" : "☆", () => save(todo, { favorite: !todo.favorite }));
          star.className = "favorite";
          star.dataset.testid = "favorite-toggle";
          star.setAttribute("aria-label", todo.favorite ? "즐겨찾기 해제" : "즐겨찾기 등록");
          star.setAttribute("aria-pressed", todo.favorite);

          const overdue = isOverdue(todo, today);
          const text = el("span", {
            textContent:
              `${todo.title} — ${todo.description} | ` +
              `우선순위: ${todo.priority || DEFAULT_PRIORITY} | ` +
              `마감일: ${todo.due_date || "없음"}` +
              (overdue ? " | ⚠ 기한 초과" : ""),
            className: todo.completed ? "done" : overdue ? "overdue" : "",
          });

          const tags = el("div", { className: "tags" });
          tags.append(...todo.tags.map((tag) => {
            const chip = button(`#${tag}`, () => { tagFilterEl.value = tag; applyFilters(); });
            chip.className = "tag";
            chip.dataset.testid = "todo-tag";
            return chip;
          }));

          const meta = el("div", { className: "meta" });
          if (todo.recurrence && todo.recurrence !== DEFAULT_RECURRENCE) {
            const badge = el("span", { className: "recurrence", textContent: `🔁 ${RECURRENCES[todo.recurrence]}` });
            badge.dataset.testid = "recurrence-badge";
            meta.append(badge);
          }
          if (todo.due_date && !todo.completed) {
            const dday = el("span", { className: overdue ? "dday overdue" : "dday", textContent: ddayLabel(todo.due_date, today) });
            dday.dataset.testid = "dday";
            meta.append(dday);
          }
          if (todo.created_at) meta.append(el("span", { textContent: `생성: ${ymd(new Date(todo.created_at))}` }));
          if (todo.completed && todo.completed_at) meta.append(el("span", { textContent: `완료: ${ymd(new Date(todo.completed_at))}` }));

          const content = el("div", { className: "content" });
          content.append(text, tags, meta, renderSubtasks(todo));

          li.dataset.testid = "todo-item";
          li.append(pick, check, star, content, button("Edit", () => edit(todo)), button("Delete", () => remove(todo.id)));
          return li;
        }

        // 하위 할 일 — 상위 completed 와 연동하지 않고 진행률만 보여준다
        const subtaskUrl = (todoId, id) => `/todos/${todoId}/subtasks${id ? `/${id}` : ""}`;

        function subtaskJob(what, job) {
          return run(what, async () => { await job(); await load(); });
        }

        function renderSubtasks(todo) {
          const total = todo.subtasks.length;
          const done = todo.subtasks.filter((s) => s.completed).length;
          const expanded = expandedSubtasks.has(todo.id);

          const toggle = button(`${expanded ? "▾" : "▸"} 하위 작업 (${total})`, () => {
            if (expanded) expandedSubtasks.delete(todo.id); else expandedSubtasks.add(todo.id);
            applyFilters();
          });
          toggle.className = "subtask-toggle";
          toggle.dataset.testid = "subtask-toggle";
          toggle.setAttribute("aria-expanded", expanded);

          const head = el("div", { className: "subtask-head" });
          head.append(toggle);
          if (total) {                           // 하위가 없으면 진행률을 숨긴다
            const progress = el("span", { className: "subtask-progress" });
            progress.dataset.testid = "subtask-progress";
            progress.append(el("progress", { max: total, value: done }),
              `${done}/${total} (${Math.round(done / total * 100)}%)`);
            head.append(progress);
          }

          const wrap = el("div");
          wrap.append(head);
          if (!expanded) return wrap;

          const list = el("div", { className: "subtasks" });
          list.dataset.testid = "subtask-list";
          const ul = el("ul");
          ul.append(...todo.subtasks.map((subtask) => renderSubtask(todo, subtask)));

          const input = el("input", { type: "text", placeholder: "하위 작업 추가" });
          input.dataset.testid = "subtask-add";
          input.dataset.todoId = todo.id;
          input.setAttribute("aria-label", `${todo.title} 하위 작업 추가`);
          const form = el("form");
          form.append(input, el("button", { type: "submit", textContent: "추가" }));
          form.onsubmit = (event) => {
            event.preventDefault();
            subtaskJob("하위 작업 추가", async () => {
              await api(subtaskUrl(todo.id), "POST", { title: input.value.trim() });
            }).then(() => listEl.querySelector(`[data-testid=subtask-add][data-todo-id="${todo.id}"]`)?.focus());
          };

          list.append(ul, form);
          wrap.append(list);
          return wrap;
        }

        function renderSubtask(todo, subtask) {
          const li = el("li");
          li.dataset.testid = "subtask-item";
          const url = subtaskUrl(todo.id, subtask.id);

          if (editingSubtask?.todoId === todo.id && editingSubtask.id === subtask.id) {
            const input = el("input", { type: "text", value: subtask.title });
            input.setAttribute("aria-label", "하위 작업 제목");
            const cancel = () => { editingSubtask = null; applyFilters(); };
            const submit = () => subtaskJob("하위 작업 수정", async () => {
              await api(url, "PUT", { title: input.value.trim(), completed: subtask.completed });
              editingSubtask = null;
            });
            input.onkeydown = (event) => {
              if (event.key === "Enter") submit();
              if (event.key === "Escape") cancel();
            };
            li.append(input, button("저장", submit), button("취소", cancel));
            return li;
          }

          const box = el("input", {
            type: "checkbox",
            checked: subtask.completed,
            onchange: () => subtaskJob("하위 작업 수정", () =>
              api(url, "PUT", { title: subtask.title, completed: box.checked })),
          });
          box.setAttribute("aria-label", `${subtask.title} 완료`);
          const title = el("span", { textContent: subtask.title, className: subtask.completed ? "done" : "" });
          const editBtn = button("수정", () => {
            editingSubtask = { todoId: todo.id, id: subtask.id };
            applyFilters();
            listEl.querySelector("[aria-label='하위 작업 제목']")?.focus();
          });
          const deleteBtn = button("삭제", () => {
            if (!confirm("정말 삭제할까요?")) return;   // 상위 할 일 삭제와 같은 확인 (하위는 실행 취소가 없다)
            subtaskJob("하위 작업 삭제", () => api(url, "DELETE"));
          });
          editBtn.setAttribute("aria-label", `${subtask.title} 수정`);
          deleteBtn.setAttribute("aria-label", `${subtask.title} 삭제`);
          li.append(box, title, editBtn, deleteBtn);
          return li;
        }

        // 수정 폼 — 저장에 실패하면 폼을 그대로 두고 오류만 띄운다
        function renderEditItem(todo) {
          const title = el("input", { type: "text", value: todo.title, placeholder: "제목" });
          const description = el("input", { type: "text", value: todo.description, placeholder: "설명" });
          const priority = el("select");
          priorityOptions(priority, todo.priority || DEFAULT_PRIORITY);
          const dueDate = el("input", { type: "date", value: todo.due_date || "" });
          const recurrence = el("select");
          recurrenceOptions(recurrence, todo.recurrence || DEFAULT_RECURRENCE);
          const tags = el("input", { type: "text", value: todo.tags.join(", "), placeholder: "태그 (쉼표로 구분)" });
          title.setAttribute("aria-label", "제목");
          description.setAttribute("aria-label", "설명");
          priority.setAttribute("aria-label", "우선순위");
          dueDate.setAttribute("aria-label", "마감일");
          recurrence.setAttribute("aria-label", "반복");
          tags.setAttribute("aria-label", "태그");

          const saveBtn = el("button", { type: "submit", textContent: "저장" });
          saveBtn.dataset.testid = "edit-save";
          const cancelBtn = button("취소", () => { editingId = null; applyFilters(); });
          cancelBtn.dataset.testid = "edit-cancel";

          const form = el("form", { className: "edit-form" });
          form.dataset.testid = "edit-form";
          form.append(title, description, priority, dueDate, recurrence, tags, saveBtn, cancelBtn);
          form.onsubmit = (event) => {
            event.preventDefault();
            run("수정", async () => {
              await api(`/todos/${todo.id}`, "PUT", toPayload(todo, {
                title: title.value.trim(),
                description: description.value.trim(),
                priority: priority.value,
                due_date: dueDate.value,
                recurrence: recurrence.value,
                tags: parseTags(tags.value),
              }));
              editingId = null;
              await load();
            });
          };

          const li = el("li");
          li.dataset.testid = "todo-item";
          li.append(form);
          return li;
        }

        function edit(todo) {
          editingId = todo.id;
          applyFilters();
          listEl.querySelector(".edit-form input")?.focus();
        }

        function remove(id) {
          if (!confirm("정말 삭제할까요?")) return;
          run("삭제", async () => {
            await api(`/todos/${id}`, "DELETE");
            showUndo([id]);
            await load();
          });
        }

        // 일괄 작업 — 삭제는 단건과 같이 confirm 후 실행 취소 토스트를 띄운다
        const BULK_LABELS = { complete: "일괄 완료", uncomplete: "일괄 미완료", delete: "일괄 삭제" };

        function bulk(action) {
          const ids = [...selectedIds];
          if (!ids.length) return;
          if (action === "delete" && !confirm(`선택한 ${ids.length}개를 삭제할까요?`)) return;
          run(BULK_LABELS[action], async () => {
            const result = await api("/todos/bulk", "POST", { ids, action });
            selectedIds.clear();
            if (result.deleted.length) showUndo(result.deleted);
            await load();
          });
        }

        $("bulk-complete").onclick = () => bulk("complete");
        $("bulk-uncomplete").onclick = () => bulk("uncomplete");
        $("bulk-delete").onclick = () => bulk("delete");
        $("bulk-select-all").onclick = () => {
          const allSelected = visibleIds.every((id) => selectedIds.has(id));
          for (const id of visibleIds) if (allSelected) selectedIds.delete(id); else selectedIds.add(id);
          applyFilters();
        };

        // 삭제 직후 실행 취소 토스트 — 새 삭제가 일어나면 내용을 바꾸고 시간을 다시 잰다
        function showUndo(ids) {
          undoIds = ids;
          $("undo-message").textContent = `${ids.length}개 삭제됨`;
          $("undo-toast").hidden = false;
          clearTimeout(undoTimer);
          undoTimer = setTimeout(hideUndo, UNDO_MS);
        }

        function hideUndo() {
          clearTimeout(undoTimer);
          $("undo-toast").hidden = true;
          undoIds = [];
        }

        $("undo-button").onclick = () => {
          const ids = undoIds;
          hideUndo();
          run("실행 취소", async () => {
            await api("/todos/restore", "POST", { ids });
            await load();
          });
        };

        priorityOptions($("priority"), DEFAULT_PRIORITY);
        recurrenceOptions($("recurrence"), DEFAULT_RECURRENCE);

        $("todo-form").onsubmit = (event) => {
          event.preventDefault();

          run("추가", async () => {
            await api("/todos", "POST", {
              title: $("title").value.trim(),
              description: $("description").value.trim(),
              priority: $("priority").value,
              due_date: $("due-date").value,
              recurrence: $("recurrence").value,
              tags: parseTags($("tags").value),
            });

            event.target.reset();
            await load();
          });
        };

        load();
     </script>
</body>
</html>
