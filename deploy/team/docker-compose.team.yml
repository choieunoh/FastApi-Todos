# 팀 서버(163.239.77.78) 전용 배포 — Compose 프로젝트 <TEAM_ACCOUNT>-todo3004, 앱 호스트 포트 3004
# - 공개 저장소용 템플릿이다. 팀 서버 계정명은 저장소에 넣지 않고 .env 의 TEAM_ACCOUNT 로 받는다.
#   TEAM_ACCOUNT 가 실제 계정명이면 프로젝트·컨테이너·네트워크·볼륨 이름이 기존 배포와 글자 그대로 같다(이름을 바꾸지 않는다).
# - 개인 서버용 docker-compose.yml(5002)과 별개 파일이다. 개인 서버에서는 이 파일을 쓰지 않는다.
# - 모든 컨테이너·볼륨·네트워크 이름이 <TEAM_ACCOUNT>-todo3004 / <TEAM_ACCOUNT>_todo3004_ 로 시작한다 — 다른 학생 리소스와 겹치지 않게.
# - 호스트에 공개하는 포트는 앱의 3004 하나뿐이다. PostgreSQL 은 내부 전용 네트워크에만 붙는다(호스트 포트 없음).
# - 이미지는 Jenkins 가 빌드·push 한 eunohchoi/fastapi-app:8 을 digest 로 고정해 pull 만 한다(이 서버에서 빌드하지 않는다).
# - 비밀값은 이 파일·Git 에 넣지 않는다. 같은 폴더의 .env(권한 600, 팀 서버에서 생성, 출력 금지)에서 읽는다:
#     TEAM_PG_ADMIN_PASSWORD, TEAM_MIGRATOR_DB_PASSWORD, TEAM_APP_DB_PASSWORD, TEAM_AUTH_FAILURE_KEY
#   비밀값이 아닌 설정: TEAM_ACCOUNT(필수), TEAM_REGISTRATION_ENABLED(선택, 소문자 true|false, 기본 false)
#   `docker compose config` 는 값을 채워 출력하므로 확인은 `config --quiet` 또는 `config --no-interpolate` 로만 한다.
# - 실행 순서(개인 서버 5002 와 같음): up -d db → healthy 확인 → run --rm migrate → up -d --no-deps app
# - down·down -v·volume prune 을 쓰지 않는다. 중지는 `stop app` / `stop db` 처럼 서비스 이름을 지정한다.
name: ${TEAM_ACCOUNT:?TEAM_ACCOUNT(팀 서버 계정명)가 .env 에 필요합니다}-todo3004

x-app-image: &app-image
  image: ${TEAM_APP_IMAGE:-eunohchoi/fastapi-app:8@sha256:65f043a5fed8164cd083bf8e2f8d171ca2b78978f00391636cdaa45b2b5291fa}
  pull_policy: missing

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true

services:
  # ---------- FastAPI (v7 코드, 할 일·템플릿은 JSON, 인증 데이터는 PostgreSQL) ----------
  app:
    <<: [*app-image, *hardening]
    container_name: ${TEAM_ACCOUNT}-todo3004-app
    restart: unless-stopped
    cap_drop:
      - ALL
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1", "--no-proxy-headers"]
    environment:
      APP_ENV: development                        # HTTP 라 production(COOKIE_SECURE=true 필수)을 쓰지 않는다
      COOKIE_SECURE: "false"
      REGISTRATION_ENABLED: ${TEAM_REGISTRATION_ENABLED:-false}   # 공개 포트라 기본은 가입 막음
      AUTH_FAILURE_KEY: ${TEAM_AUTH_FAILURE_KEY:?TEAM_AUTH_FAILURE_KEY 가 .env 에 필요합니다}
      # URL 에는 비밀번호를 넣지 않는다 — libpq 가 PGPASSWORD 를 읽는다 (개인 서버·v7 시연과 같은 방식)
      DATABASE_URL: postgresql://todo_app@db:5432/todo_team
      PGPASSWORD: ${TEAM_APP_DB_PASSWORD:?TEAM_APP_DB_PASSWORD 가 .env 에 필요합니다}
      TODO_FILE: /app/data/todo.json              # 이 프로젝트 전용 볼륨 안 (처음엔 빈 목록)
      TEMPLATE_FILE: /app/data/task_templates.json
    ports:
      - "3004:8000"                               # 팀 서버에서 공개하는 유일한 포트
    volumes:
      - app-data:/app/data
    networks:
      - backend
      - front
    depends_on:
      db:
        condition: service_healthy

  # ---------- 전용 PostgreSQL 18 (users·sessions·auth_failures) ----------
  db:
    image: postgres:18.6-trixie
    container_name: ${TEAM_ACCOUNT}-todo3004-db
    restart: unless-stopped
    <<: *hardening
    environment:
      POSTGRES_USER: team_admin                   # 초기화 전용 슈퍼유저. 앱·마이그레이션은 쓰지 않는다
      POSTGRES_PASSWORD: ${TEAM_PG_ADMIN_PASSWORD:?TEAM_PG_ADMIN_PASSWORD 가 .env 에 필요합니다}
      POSTGRES_DB: todo_team
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
      MIGRATOR_DB_PASSWORD: ${TEAM_MIGRATOR_DB_PASSWORD:?TEAM_MIGRATOR_DB_PASSWORD 가 .env 에 필요합니다}
      APP_DB_PASSWORD: ${TEAM_APP_DB_PASSWORD:?TEAM_APP_DB_PASSWORD 가 .env 에 필요합니다}
    configs:
      - source: pg-init-roles
        target: /docker-entrypoint-initdb.d/10-roles.sh
    volumes:
      - pg-data:/var/lib/postgresql                # PostgreSQL 18 이미지는 데이터가 /var/lib/postgresql/18/docker
    networks:
      - backend
    # ports 없음 — 호스트·외부에서 접속할 수 없다 (서버의 다른 PostgreSQL 과 무관)
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U team_admin -d todo_team"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---------- 일회성 마이그레이션 — `run --rm -T migrate` 로만 실행 (profile 때문에 up 에 포함되지 않음) ----------
  migrate:
    <<: [*app-image, *hardening]
    profiles: ["migrate"]
    restart: "no"
    cap_drop:
      - ALL
    command: ["sh", "-c", "alembic upgrade head && python /opt/team/post_migrate_grants.py"]
    configs:
      - source: post-migrate-grants
        target: /opt/team/post_migrate_grants.py
    environment:
      DATABASE_URL: postgresql://todo_migrator@db:5432/todo_team
      PGPASSWORD: ${TEAM_MIGRATOR_DB_PASSWORD:?TEAM_MIGRATOR_DB_PASSWORD 가 .env 에 필요합니다}
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy

networks:
  backend:
    name: ${TEAM_ACCOUNT}_todo3004_backend
    internal: true                                # db·migrate·app 만. 외부로 나가는 경로 없음
  front:
    name: ${TEAM_ACCOUNT}_todo3004_front                # app 의 3004 공개용

volumes:
  app-data:
    name: ${TEAM_ACCOUNT}_todo3004_app-data             # 할 일·템플릿 JSON (합성 데이터만)
  pg-data:
    name: ${TEAM_ACCOUNT}_todo3004_pg-data

configs:
  # 첫 기동(빈 데이터 폴더) 때 한 번만 실행된다. 비밀번호는 컨테이너 환경변수에서 읽고 출력하지 않는다.
  # 역할: todo_migrator(스키마 객체 소유, DDL) / todo_app(표 DML·시퀀스 사용만). 둘 다 비슈퍼유저. (개인 서버 jm-db 와 같은 설계)
  pg-init-roles:
    content: |
      #!/bin/sh
      set -eu
      if [ $${#MIGRATOR_DB_PASSWORD} -lt 24 ] || [ $${#APP_DB_PASSWORD} -lt 24 ]; then
        echo "MIGRATOR_DB_PASSWORD·APP_DB_PASSWORD 는 24자 이상이어야 합니다" >&2; exit 1
      fi
      psql -v ON_ERROR_STOP=1 --username "$$POSTGRES_USER" --dbname "$$POSTGRES_DB" \
        -v migrator_pw="$$MIGRATOR_DB_PASSWORD" -v app_pw="$$APP_DB_PASSWORD" <<'EOSQL'
      CREATE ROLE todo_migrator LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS PASSWORD :'migrator_pw';
      CREATE ROLE todo_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS PASSWORD :'app_pw';
      REVOKE ALL ON DATABASE todo_team FROM PUBLIC;
      GRANT CONNECT ON DATABASE todo_team TO todo_migrator, todo_app;
      REVOKE ALL ON SCHEMA public FROM PUBLIC;
      GRANT USAGE, CREATE ON SCHEMA public TO todo_migrator;
      GRANT USAGE ON SCHEMA public TO todo_app;
      ALTER DEFAULT PRIVILEGES FOR ROLE todo_migrator IN SCHEMA public
        GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO todo_app;
      ALTER DEFAULT PRIVILEGES FOR ROLE todo_migrator IN SCHEMA public
        GRANT USAGE, SELECT ON SEQUENCES TO todo_app;
      EOSQL

  # migrate 의 마지막 단계 — 개인 서버 docker-compose.yml 의 jm-post-migrate-grants 와 같은 내용 (DB 이름과 무관)
  post-migrate-grants:
    content: |
      import os
      import sys

      import psycopg

      APP = "todo_app"
      MIGRATOR = "todo_migrator"
      BUSINESS = ("users", "sessions", "auth_failures", "todos", "subtasks", "task_templates", "data_migrations")
      DML = ("SELECT", "INSERT", "UPDATE", "DELETE")
      ALL_TABLE_PRIVS = "SELECT,INSERT,UPDATE,DELETE,TRUNCATE,REFERENCES,TRIGGER,MAINTAIN"


      def fail(message):
          print("POST_MIGRATE_FAIL: " + message, file=sys.stderr)
          sys.exit(1)


      with psycopg.connect(os.environ["DATABASE_URL"], autocommit=True) as conn:
          if conn.execute("SELECT current_user").fetchone()[0] != MIGRATOR:
              fail("todo_migrator 로 접속하지 않았습니다")
          owner = conn.execute(
              "SELECT tableowner FROM pg_tables WHERE schemaname = 'public' AND tablename = 'alembic_version'").fetchone()
          if owner is None or owner[0] != MIGRATOR:
              fail("alembic_version 이 없거나 소유자가 todo_migrator 가 아닙니다")
          with conn.transaction():
              conn.execute("REVOKE ALL ON TABLE public.alembic_version FROM todo_app")
          if conn.execute("SELECT has_table_privilege(%s, 'public.alembic_version', %s)", (APP, ALL_TABLE_PRIVS)).fetchone()[0]:
              fail("todo_app 에 alembic_version 권한이 남아 있습니다")
          if not conn.execute("SELECT has_table_privilege(%s, 'public.alembic_version', 'SELECT,INSERT,UPDATE,DELETE')",
                              (MIGRATOR,)).fetchone()[0]:
              fail("todo_migrator 의 alembic_version 권한이 없습니다")
          for table in BUSINESS:
              for priv in DML:
                  if not conn.execute("SELECT has_table_privilege(%s, %s, %s)", (APP, "public." + table, priv)).fetchone()[0]:
                      fail("todo_app 의 " + table + " " + priv + " 권한이 없습니다")
          seqs = [r[0] for r in conn.execute(
              "SELECT c.oid::regclass::text FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace "
              "WHERE n.nspname = 'public' AND c.relkind = 'S'").fetchall()]
          for seq in seqs:
              if not conn.execute("SELECT has_sequence_privilege(%s, %s, 'USAGE')", (APP, seq)).fetchone()[0]:
                  fail("todo_app 의 시퀀스 USAGE 권한이 없습니다")
          if conn.execute("SELECT rolsuper FROM pg_roles WHERE rolname = %s", (APP,)).fetchone()[0]:
              fail("todo_app 이 슈퍼유저입니다")
      print("POST_MIGRATE_OK")
