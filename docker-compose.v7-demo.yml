# (7.0.0) 학교 서버 제한 시연 전용 — SSH 터널로만 접속한다. 외부 공개 금지.
# - v7.0.0 데이터 API 15개는 인증·CSRF·사용자별 격리가 없다(V7_PLAN.md R-34). 그래서 앱은 호스트 127.0.0.1:8007 에만 묶는다.
# - 운영 docker-compose.yml(v6.0.0)과 섞어 쓰지 않는다. 프로젝트·컨테이너·네트워크·볼륨 이름과 포트가 겹치지 않는다.
#   (v6 운영 볼륨 fastapi_todos_fastapi-data·포트 5001·서버 PostgreSQL 5432~5434 를 쓰지 않는다)
# - PostgreSQL 은 호스트 포트를 공개하지 않는다. 내부 네트워크(backend)에서만 접속한다.
# - 비밀값은 이 파일에 넣지 않는다. 같은 폴더의 .env(권한 600, git 제외)에서 읽는다 — 아래 "필요한 .env 변수".
#   주의: `docker compose config` 는 .env 값을 채워 출력한다(비밀번호 노출). 확인은 아래 명령처럼 값 없이 한다.
#
# 필요한 .env 변수 (값은 hex 로 만든다 — 예: openssl rand -hex 32. 화면·로그에 출력하지 않는다)
#   POSTGRES_ADMIN_PASSWORD   DB 초기화 전용 슈퍼유저(todo_admin). 앱·마이그레이션은 쓰지 않는다
#   MIGRATOR_DB_PASSWORD      todo_migrator (비슈퍼유저, 스키마 객체 소유 — alembic upgrade 전용)
#   APP_DB_PASSWORD           todo_app (비슈퍼유저, 표 읽기·쓰기만 — 앱 실행 전용)
#   AUTH_FAILURE_KEY          로그인 시도 제한 HMAC 키 (python -c "import secrets; print(secrets.token_urlsafe(32))")
#   REGISTRATION_ENABLED      선택, 기본 true. 시연 계정을 만든 뒤 false 로 바꾸고 app 을 다시 만든다
#
# 순서 (서버, 각 단계 승인 후). -f 를 빼면 운영 compose 를 가리키므로 반드시 붙인다:
#   C="docker compose -f docker-compose.v7-demo.yml"
#   $C config --no-interpolate --quiet && $C config --services && $C config --volumes   # 비밀값 없이 구조만 확인
#   $C build app
#   $C up -d db                       # 첫 기동 때만 init 스크립트(역할·권한)가 돈다. healthy 확인
#   $C run --rm migrate && echo MIGRATE_OK   # alembic upgrade head → alembic_version 권한 회수 → 권한 검증 (앱 실행 전 별도 단계)
#                                     # 종료 코드가 0 이 아니거나 MIGRATE_OK 가 없으면 여기서 멈춘다 — app 을 띄우지 않는다
#   $C up -d app                      # http://127.0.0.1:8007 (서버 안) — 브라우저는 SSH 터널 localhost:8007
#   $C stop                           # 중단 (데이터 유지).  down 은 컨테이너·네트워크만 지운다. -v·volume prune 금지
name: fastapi-v7-demo

x-app-image: &app-image
  build:
    context: ./fastapi-app
    dockerfile: Dockerfile
  image: fastapi-todos-v7-demo:7.0.0

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true

services:
  db:
    image: postgres:18.6-trixie
    restart: "no"
    <<: *hardening
    environment:
      POSTGRES_USER: todo_admin
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?POSTGRES_ADMIN_PASSWORD 를 .env 에 설정하세요}
      POSTGRES_DB: todo_demo
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
      # init 스크립트만 읽는다 (첫 기동 때 역할 비밀번호 설정)
      MIGRATOR_DB_PASSWORD: ${MIGRATOR_DB_PASSWORD:?MIGRATOR_DB_PASSWORD 를 .env 에 설정하세요}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD 를 .env 에 설정하세요}
    configs:
      - source: pg-init-roles
        target: /docker-entrypoint-initdb.d/10-roles.sh
    volumes:
      # PostgreSQL 18 이미지는 데이터 폴더가 /var/lib/postgresql/18/docker 라 상위 폴더에 붙인다
      - pg-data:/var/lib/postgresql
    networks:
      - backend
    # ports 없음 — 호스트·외부에서 접속할 수 없다
    healthcheck:
      # TCP 로 확인한다 — init 단계의 임시 서버는 소켓만 열어서, 소켓 확인은 역할 생성 전에 ready 로 보일 수 있다
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U todo_admin -d todo_demo"]
      interval: 5s
      timeout: 3s
      retries: 20

  # 일회성 마이그레이션 — `run --rm migrate` 로만 실행한다 (profile 때문에 `up` 에는 포함되지 않는다)
  migrate:
    <<: [*app-image, *hardening]
    profiles: ["migrate"]
    restart: "no"
    cap_drop:
      - ALL
    # 1) 마이그레이션 2) todo_app 의 alembic_version 권한 회수 3) 권한 검증. 하나라도 실패하면 0 이 아닌 코드로 끝난다
    #    (다시 실행해도 안전: upgrade head 는 이미 최신이면 아무것도 하지 않고, REVOKE 는 반복해도 같다)
    command: ["sh", "-c", "alembic upgrade head && python /opt/demo/post_migrate_grants.py"]
    configs:
      - source: post-migrate-grants
        target: /opt/demo/post_migrate_grants.py
    environment:
      # URL 에는 비밀번호를 넣지 않는다. libpq 가 PGPASSWORD 를 읽는다 (URL 인코딩·오류 메시지 노출 방지)
      DATABASE_URL: postgresql://todo_migrator@db:5432/todo_demo
      PGPASSWORD: ${MIGRATOR_DB_PASSWORD:?MIGRATOR_DB_PASSWORD 를 .env 에 설정하세요}
    networks:
      - backend
    depends_on:
      db:
        condition: service_healthy

  app:
    <<: [*app-image, *hardening]
    restart: "no"
    cap_drop:
      - ALL
    # 워커 1개. X-Forwarded-* 를 믿지 않는다 (시도 제한 IP 위조 방지, V7_PLAN.md R-12)
    command: ["uvicorn", "main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "1", "--no-proxy-headers"]
    environment:
      APP_ENV: development              # SSH 터널은 HTTP 라 Secure 쿠키를 쓰지 않는다 (production 은 COOKIE_SECURE=true 필수)
      COOKIE_SECURE: "false"
      REGISTRATION_ENABLED: ${REGISTRATION_ENABLED:-true}
      AUTH_FAILURE_KEY: ${AUTH_FAILURE_KEY:?AUTH_FAILURE_KEY 를 .env 에 설정하세요}   # 공개 개발용 대체 키를 쓰지 않는다
      DATABASE_URL: postgresql://todo_app@db:5432/todo_demo
      PGPASSWORD: ${APP_DB_PASSWORD:?APP_DB_PASSWORD 를 .env 에 설정하세요}
      TODO_FILE: /app/data/todo.json                    # v7 시연 전용 볼륨 안 (처음엔 빈 목록)
      TEMPLATE_FILE: /app/data/task_templates.json
    ports:
      - "127.0.0.1:8007:8000"           # 서버 자신에게만 공개. 0.0.0.0·외부 IP 로 바꾸지 않는다
    volumes:
      - app-data:/app/data
    networks:
      - backend
      - frontend
    depends_on:
      db:
        condition: service_healthy

networks:
  backend:
    name: fastapi_v7_demo_backend
    internal: true                      # 외부로 나가는 경로 없음 (db·migrate·app 만)
  frontend:
    name: fastapi_v7_demo_frontend      # app 의 127.0.0.1:8007 공개용

volumes:
  pg-data:
    name: fastapi_v7_demo_pg-data
  app-data:
    name: fastapi_v7_demo_app-data

configs:
  # 첫 기동(빈 데이터 폴더) 때 한 번만 실행된다. 비밀번호는 컨테이너 환경변수에서 읽고 출력하지 않는다.
  # 역할: todo_migrator(스키마 객체 소유, DDL) / todo_app(표 DML·시퀀스 사용만). 둘 다 비슈퍼유저.
  pg-init-roles:
    content: |
      #!/bin/sh
      set -eu
      if [ $${#MIGRATOR_DB_PASSWORD} -lt 24 ] || [ $${#APP_DB_PASSWORD} -lt 24 ]; then
        echo "MIGRATOR_DB_PASSWORD·APP_DB_PASSWORD 는 24자 이상이어야 합니다" >&2; exit 1
      fi
      psql -v ON_ERROR_STOP=1 --username "$$POSTGRES_USER" --dbname "$$POSTGRES_DB" \
        -v migrator_pw="$$MIGRATOR_DB_PASSWORD" -v app_pw="$$APP_DB_PASSWORD" <<'EOSQL'
      CREATE ROLE todo_migrator LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS PASSWORD :'migrator_pw';
      CREATE ROLE todo_app LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOREPLICATION NOBYPASSRLS PASSWORD :'app_pw';
      REVOKE ALL ON DATABASE todo_demo FROM PUBLIC;
      GRANT CONNECT ON DATABASE todo_demo TO todo_migrator, todo_app;
      REVOKE ALL ON SCHEMA public FROM PUBLIC;
      GRANT USAGE, CREATE ON SCHEMA public TO todo_migrator;
      GRANT USAGE ON SCHEMA public TO todo_app;
      ALTER DEFAULT PRIVILEGES FOR ROLE todo_migrator IN SCHEMA public
        GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO todo_app;
      ALTER DEFAULT PRIVILEGES FOR ROLE todo_migrator IN SCHEMA public
        GRANT USAGE, SELECT ON SEQUENCES TO todo_app;
      EOSQL

  # migrate 의 마지막 단계 (todo_migrator 로 실행 — alembic_version 의 소유자라 권한을 회수할 수 있다).
  # - 기본 권한 때문에 todo_app 이 받은 alembic_version 권한만 회수한다. 소유자(todo_migrator) 권한은 그대로다.
  # - 업무 표 7개와 그 시퀀스의 todo_app 권한은 건드리지 않고, 남아 있는지 검사만 한다.
  # - 출력은 결과 문구뿐이다(비밀번호·접속 문자열·행 내용을 출력하지 않는다). 실패하면 exit 1.
  post-migrate-grants:
    content: |
      import os
      import sys

      import psycopg

      APP = "todo_app"
      MIGRATOR = "todo_migrator"
      BUSINESS = ("users", "sessions", "auth_failures", "todos", "subtasks", "task_templates", "data_migrations")
      DML = ("SELECT", "INSERT", "UPDATE", "DELETE")
      ALL_TABLE_PRIVS = "SELECT,INSERT,UPDATE,DELETE,TRUNCATE,REFERENCES,TRIGGER,MAINTAIN"


      def fail(message):
          print("POST_MIGRATE_FAIL: " + message, file=sys.stderr)
          sys.exit(1)


      with psycopg.connect(os.environ["DATABASE_URL"], autocommit=True) as conn:
          if conn.execute("SELECT current_user").fetchone()[0] != MIGRATOR:
              fail("todo_migrator 로 접속하지 않았습니다")
          owner = conn.execute(
              "SELECT tableowner FROM pg_tables WHERE schemaname = 'public' AND tablename = 'alembic_version'").fetchone()
          if owner is None or owner[0] != MIGRATOR:
              fail("alembic_version 이 없거나 소유자가 todo_migrator 가 아닙니다")
          with conn.transaction():
              conn.execute("REVOKE ALL ON TABLE public.alembic_version FROM todo_app")
          if conn.execute("SELECT has_table_privilege(%s, 'public.alembic_version', %s)", (APP, ALL_TABLE_PRIVS)).fetchone()[0]:
              fail("todo_app 에 alembic_version 권한이 남아 있습니다")
          if not conn.execute("SELECT has_table_privilege(%s, 'public.alembic_version', 'SELECT,INSERT,UPDATE,DELETE')",
                              (MIGRATOR,)).fetchone()[0]:
              fail("todo_migrator 의 alembic_version 권한이 없습니다")
          for table in BUSINESS:
              for priv in DML:
                  if not conn.execute("SELECT has_table_privilege(%s, %s, %s)", (APP, "public." + table, priv)).fetchone()[0]:
                      fail("todo_app 의 " + table + " " + priv + " 권한이 없습니다")
          seqs = [r[0] for r in conn.execute(
              "SELECT c.oid::regclass::text FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace "
              "WHERE n.nspname = 'public' AND c.relkind = 'S'").fetchall()]
          for seq in seqs:
              if not conn.execute("SELECT has_sequence_privilege(%s, %s, 'USAGE')", (APP, seq)).fetchone()[0]:
                  fail("todo_app 의 시퀀스 USAGE 권한이 없습니다")
          if conn.execute("SELECT rolsuper FROM pg_roles WHERE rolname = %s", (APP,)).fetchone()[0]:
              fail("todo_app 이 슈퍼유저입니다")
      print("POST_MIGRATE_OK: alembic_version 권한 회수, 업무 표 " + str(len(BUSINESS)) + "개·시퀀스 " + str(len(seqs)) + "개 권한 확인")
